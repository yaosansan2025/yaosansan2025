name: Update Discord status

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_discord_status.py
      - assets/app-icons/**
      - .github/workflows/update-discord-status.yml

permissions:
  contents: write

concurrency:
  group: discord-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Generate status card
        env:
          DISCORD_USER_ID: "1347445329146155100"
        run: python3 scripts/update_discord_status.py
      - name: Save changed card
        run: |
          if git diff --quiet -- assets/discord-status.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/discord-status.svg
          git commit -m "Update Discord status [skip ci]"
          git push
